<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bookshelf">
<meta name="theme-color" content="#6366f1">
<link rel="manifest" href="manifest.json">

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<title>Bookshelf</title>
<style>
:root{--ac:#6366f1}
body.t-original{--bg:#f5f5f7;--fg:#111;--ui:#fff;--card:#fff;--mut:#777;--cf:none}
body.t-quiet{--bg:#48484c;--fg:#ececf0;--ui:#66666b;--card:#5a5a5f;--mut:#b4b4ba;--cf:invert(1) hue-rotate(180deg) contrast(.55) brightness(1.25)}
body.t-night{--bg:#0b0b0d;--fg:#e8e8ec;--ui:#2a2a30;--card:#1c1c20;--mut:#999;--cf:invert(1) hue-rotate(180deg) brightness(.88)}
body.t-paper{--bg:#e9e7e8;--fg:#222;--ui:#f6f5f5;--card:#f6f5f5;--mut:#777;--cf:brightness(.93) contrast(.95)}
body.t-bold{--bg:#fff;--fg:#000;--ui:#efefef;--card:#f2f2f2;--mut:#555;--cf:contrast(1.6) brightness(.95)}
body.t-calm{--bg:#efe2c8;--fg:#3b2f1e;--ui:#f6ecd8;--card:#f6ecd8;--mut:#6b5a40;--cf:sepia(.35) saturate(1.15) brightness(.96)}
body.t-focus{--bg:#fdfbf3;--fg:#222;--ui:#f1eee2;--card:#fff;--mut:#777;--cf:sepia(.07)}
body.t-eye{--bg:#d3e4ca;--fg:#1f3320;--ui:#e5f0df;--card:#e5f0df;--mut:#4d6a4a;--cf:sepia(.3) hue-rotate(55deg) saturate(.75) brightness(.95)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,-apple-system,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
button,select,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid #8884;border-radius:12px;padding:8px 12px}
svg{display:block;flex:none}
/* 3D glass look */
.g3{color:var(--fg);border:0;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),var(--ui);
 box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),inset 0 -2px 4px rgba(0,0,0,.10),0 8px 20px rgba(0,0,0,.22),0 1px 2px rgba(0,0,0,.25)}
.g3:active{transform:scale(.97)}
/* home */
#home{flex:1;overflow:auto;padding:18px 16px 40px;-webkit-overflow-scrolling:touch}
.top{display:flex;align-items:center;gap:10px}
.top>span svg{width:44px;height:44px;border-radius:11px;box-shadow:0 6px 14px #6366f177}
.top h1{margin:0;font-size:30px;flex:1;letter-spacing:-.5px}
.round{width:42px;height:42px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center}
.chip{display:inline-block;margin:12px 0 0;padding:5px 12px;border-radius:20px;background:var(--card);font-size:12px;color:var(--mut);box-shadow:0 1px 4px #0002}
h2{font-size:20px;margin:26px 0 12px}
.hero{display:flex;gap:16px;background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 50%),var(--card);border-radius:22px;padding:16px;margin-top:18px;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),0 10px 30px #0003;cursor:pointer}
.hero .cv{width:96px;flex:none}
.hi{display:flex;flex-direction:column;gap:6px;justify-content:center;min-width:0;flex:1}
.hi small{color:var(--ac);font-weight:700;letter-spacing:1px;font-size:11px}
.hi b{font-size:17px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hi span{color:var(--mut);font-size:13px}
.hi button{background:var(--ac);color:#fff;border:0;align-self:flex-start;margin-top:4px;border-radius:20px;padding:8px 16px;pointer-events:none;box-shadow:inset 0 1px 0 #fff6,0 4px 10px #0003}
.pb{height:5px;background:#8883;border-radius:5px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:22px 16px}
.book,.hero{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.book{cursor:pointer}
.book img,.hero img{pointer-events:none;-webkit-user-drag:none}
.cv{position:relative;aspect-ratio:3/4;border-radius:3px 9px 9px 3px;overflow:hidden;box-shadow:0 10px 20px #0004;background:linear-gradient(135deg,#6366f1,#a855f7);display:flex;align-items:center;justify-content:center;font-size:34px;transition:transform .15s}
.book:active .cv{transform:scale(.95)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0005 0,#fff4 3%,#0001 6%,transparent 12%);pointer-events:none}
.book .t{font-size:12px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book .p{font-size:11px;color:var(--mut)}
.empty{text-align:center;padding:60px 20px;color:var(--mut)}
.empty svg{width:96px;height:96px;border-radius:24px;box-shadow:0 10px 30px #6366f155;margin:0 auto}
.empty button{background:var(--ac);color:#fff;border:0;border-radius:24px;padding:12px 24px;margin-top:18px;font-size:16px}
/* reader */
#reader{display:none;flex:1;min-height:0;position:relative}
#stage{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y pinch-zoom;background:var(--bg);isolation:isolate}
body.drawing #stage{touch-action:none}
#pbox{position:relative;width:100%;overflow:hidden;background:var(--bg);min-height:100%}
#sc{display:none;position:relative}
.pg{position:absolute;left:0;top:0;width:100%;background:var(--bg);backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:translateZ(0)}
.pc{display:block;width:100%;height:auto;filter:var(--cf)}
.ink{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
body.drawing .pg .ink{pointer-events:auto;touch-action:none}
.sh{position:absolute;inset:0;pointer-events:none;opacity:0}
.sp{position:relative;background:var(--bg);overflow:hidden}
#spin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:3;pointer-events:none}
#spin.off{display:none}
#spin i{width:34px;height:34px;border:3px solid rgba(128,128,128,.3);border-top-color:var(--ac);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ui{opacity:0;pointer-events:none;transition:opacity .22s}
body.showui .ui{opacity:1;pointer-events:auto}
.rb{position:fixed;width:46px;height:46px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;z-index:20}
#xbtn{right:14px;top:calc(env(safe-area-inset-top) + 10px)}
#mbtn{right:14px;bottom:calc(env(safe-area-inset-bottom) + 16px)}
body.menuopen #mbtn{opacity:0;pointer-events:none}
.pill{position:fixed;left:50%;transform:translateX(-50%);padding:6px 16px;border-radius:20px;color:var(--mut);font-size:15px;z-index:20;white-space:nowrap}
#chpill{top:calc(env(safe-area-inset-top) + 14px)}
#pgpill{bottom:calc(env(safe-area-inset-bottom) + 18px);opacity:.5;transition:opacity .2s;pointer-events:none}
body.showui #pgpill,body.menuopen #pgpill{opacity:1}
#ttl{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);max-width:60%;font-size:13px;color:var(--mut);opacity:.7;z-index:4;pointer-events:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;transition:opacity .2s}
body.showui #ttl,body.drawing #ttl{opacity:0}
/* menu */
#mscrim{position:fixed;inset:0;background:radial-gradient(circle at 85% 92%,rgba(0,0,0,.45),rgba(0,0,0,0) 70%);opacity:0;pointer-events:none;transition:opacity .25s;z-index:19}
body.menuopen #mscrim{opacity:1}
#mw{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:21;display:flex;gap:10px;align-items:flex-end;opacity:0;visibility:hidden;transform:scale(.86) translateY(12px);transform-origin:100% 100%;transition:opacity .22s,transform .25s cubic-bezier(.2,.9,.3,1.2),visibility .25s}
body.menuopen #mw{opacity:1;visibility:visible;transform:none}
#mp{width:min(280px,62vw);display:flex;flex-direction:column;gap:8px}
#mw.drag #mp{opacity:0;pointer-events:none}
.mi{display:flex;justify-content:space-between;align-items:center;width:100%;height:48px;padding:0 20px;border-radius:24px;font-size:16px;backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5)}
.mi b{display:flex;font-weight:600}
.mr{display:flex;gap:8px}.mr .mi{justify-content:center;padding:0}
.mi.on{background:var(--ac);color:#fff}
.aa{font-weight:700;font-size:20px}.aa small{font-size:13px}
.seg{padding:0;overflow:hidden}
.seg button{flex:1;height:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:none;border:0;border-radius:0;color:inherit;font-size:16px}
.seg button+button{flex:0 0 58px;border-left:1px solid rgba(128,128,128,.3)}
#slw{position:relative;width:52px;height:205px;touch-action:none;flex:none}
#trk{position:absolute;inset:0;border-radius:26px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 50%),rgba(165,165,172,.93);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),0 8px 20px rgba(0,0,0,.3)}
#fill{height:0;background:rgba(40,40,46,.38);border-bottom:3px solid rgba(255,255,255,.9)}
#bub{display:none;position:absolute;right:calc(100% + 12px);top:0;transform:translateY(-50%);padding:10px 18px;border-radius:20px;text-align:center;font-size:17px;min-width:110px;white-space:nowrap;color:var(--fg);background:var(--ui);box-shadow:0 6px 18px #0004}
#mw.drag #bub{display:block}
.bc{font-size:14px;color:var(--mut);max-width:170px;overflow:hidden;text-overflow:ellipsis}
/* pen toolbar */
#ptb{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:14px;display:none;gap:4px;padding:5px;border-radius:30px;z-index:22}
body.drawing #ptb{display:flex}
#ptb button{width:42px;height:42px;border-radius:50%;border:0;background:none;padding:0;color:var(--fg);display:flex;align-items:center;justify-content:center}
#ptb button.on{background:var(--ac);color:#fff;box-shadow:inset 0 1px 0 #fff6,0 3px 8px #0004}
/* sheets */
#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:29}
body.sheeted #scrim{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:700px;max-height:80%;overflow:auto;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,0) 30%),var(--ui);color:var(--fg);padding:14px 16px calc(env(safe-area-inset-bottom) + 16px);z-index:30;border-radius:26px 26px 0 0;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),0 -8px 34px #0005;transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility .3s}
.sheet.show{transform:none;visibility:visible}
.sh2{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:19px;font-weight:700}
.xr{width:38px;height:38px;border-radius:50%;padding:0;border:0;background:rgba(128,128,128,.25);display:flex;align-items:center;justify-content:center}
.sheet label{display:flex;justify-content:space-between;align-items:center;margin:12px 0}
.sheet .mi{background:rgba(128,128,128,.18);box-shadow:none;margin-top:8px}
.sheet .mi svg{margin-right:10px}
.sheet .mi.dg{color:#e11d48}
.rel{position:relative}
#fm{display:none;position:absolute;left:0;top:calc(100% + 6px);background:var(--card);border-radius:18px;box-shadow:0 8px 30px #0006;z-index:5;padding:6px;min-width:230px}
#fm.show{display:block}
#fm button{display:flex;gap:10px;width:100%;border:0;background:none;text-align:left;padding:12px 14px;font-size:16px}
#fm i{width:16px;font-style:normal}
#tiles{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px}
.tile{flex:none;width:84px;height:84px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;font-family:Georgia,serif;cursor:pointer;border:2px solid #8884;box-shadow:inset 0 1.5px 0 #fff6,0 4px 10px #0002}
.tile small{font:12px system-ui}
.tile.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
#cust{display:none}#cust.show{display:block}
.bars{display:flex;gap:6px;align-items:flex-end;height:90px}.bars div{flex:1;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px;font-size:10px;text-align:center;color:#fff}
.ti{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:12px;text-align:left;border-bottom:1px solid #8883;border-radius:0}
.ti span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ti i{font-style:normal;color:var(--mut);margin-left:10px}
.mut{color:var(--mut)}
.gp{display:flex;gap:8px}.gp input{flex:1}.gp button{background:var(--ac);color:#fff;border:0}
.seg2{display:flex;gap:8px}
.seg2 button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;border:0;background:rgba(128,128,128,.18)}
.seg2 button.on{background:var(--ac);color:#fff}
.cols{display:flex;gap:12px;margin:16px 0;flex-wrap:wrap}
.cols i{width:34px;height:34px;border-radius:50%;border:2px solid #8886;box-shadow:inset 0 2px 3px #fff6,0 3px 6px #0003}
.cols i.sel{outline:3px solid var(--ac);outline-offset:2px}
#bmhead{display:flex;gap:12px;align-items:center;margin-bottom:6px}
#bmhead .cv{width:48px;flex:none}
#guide{position:fixed;left:0;right:0;top:40%;height:44px;box-shadow:0 0 0 100vmax rgba(0,0,0,.55);border-block:2px solid var(--ac);touch-action:none;display:none;z-index:5}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:50}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 16px;border-radius:20px;display:none;z-index:60;max-width:88%;text-align:center}
</style></head><body class="t-original">

 </div>
</div>

// ---------- page turn engine ----------
function flipStart(dir){if(fl||!curO||!doc)return false;const n=page+dir;if(n<1||n>doc.numPages)return false;
 const o=getEl(n);fl={dir,o,cur:curO,p:0};pbox.append(o.el);flipSet(0);return true}
function flipSet(p){if(!fl)return;fl.p=p;const{dir,o,cur}=fl,m=S.flip;
 if(m=='slide'){cur.el.style.transform=`translate3d(${-dir*p*100}%,0,0)`;o.el.style.transform=`translate3d(${dir*(1-p)*100}%,0,0)`}
 else if(m=='fade'){cur.el.style.zIndex=1;o.el.style.zIndex=2;o.el.style.opacity=p}
 else{const top=dir>0?cur:o,bot=dir>0?o:cur,t=dir>0?p:1-p;
  top.el.style.zIndex=3;bot.el.style.zIndex=1;top.el.style.transformOrigin='0 50%';
  top.el.style.transform=`perspective(3000px) rotateY(${-t*95}deg)`;
  top.el.style.boxShadow=`0 0 ${10+t*50}px rgba(0,0,0,${.35*(1-t*.5)})`;
  top.sh.style.background='linear-gradient(90deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.6))';top.sh.style.opacity=t*.9;
  bot.sh.style.background='#000';bot.sh.style.opacity=(1-t)*.38}}
function rs(o){const s=o.el.style;s.transform=s.opacity=s.zIndex=s.boxShadow=s.transformOrigin='';o.sh.style.opacity=0;o.sh.style.background=''}
function anim(to,dur,done){if(!fl)return;const from=fl.p,t0=performance.now();
 const f=t=>{if(!fl)return;const k=Math.max(0,Math.min(1,(t-t0)/dur)),e=1-Math.pow(1-k,3);flipSet(from+(to-from)*e);k<1?requestAnimationFrame(f):done()};requestAnimationFrame(f)}
function flipEnd(v){if(!fl)return;const ok=fl.p>.3||(-fl.dir*v>.5&&fl.p>.04),to=ok?1:0;fl.anim=true;anim(to,Math.abs(to-fl.p)*380+140,()=>flipFinish(ok))}
function flipFinish(ok){if(!fl)return;const{o,cur}=fl;rs(cur);rs(o);
 if(ok){cur.el.remove();curO=o;page=o.n;pbox.style.height=o.el.offsetHeight+'px';stage.scrollTop=0;pageChanged();prefetch()}else o.el.remove();
 fl=null;if(want){const w=want;want=0;show(w)}}

async function paintC(c,pn){const p=await doc.getPage(pn),rot=((p.rotate||0)+((meta.rot||{})[pn]||0))%360,v=p.getViewport({scale:1,rotation:rot}),s=stage.clientWidth/v.width,vp=p.getViewport({scale:s*Math.min(devicePixelRatio||1,2),rotation:rot});

 for(let i=1;i<=doc.numPages;i++){const d=document.createElement('div');d.className='sp';d.dataset.p=i;d.style.height=h+'px';sc.append(d);io.observe(d)}}

 try{await paintC(c,+d.dataset.p)}catch(e){if(d._t===t)d._r=0;return}

const onInk=t=>t&&t.classList&&t.classList.contains('ink')&&curO&&curO.el.contains(t);

 if(stroke&&e.pointerId==stroke.id){endStroke();return}
 if(g&&e.pointerId==g.id){const gg=g;g=null;if(gg.mode=='h')flipEnd(0)}});
function tap(e,tg){
 if(document.querySelector('.sheet.show')){tog();return}
 if(document.body.classList.contains('menuopen')){menu(0);return}
 if(tool){if(S.pk=='tx'&&onInk(tg))addText(e);return}
 document.body.classList.toggle('showui')}
function menu(o){document.body.classList.toggle('menuopen',!!o);if(o)document.body.classList.add('showui')}
document.addEventListener('keydown',e=>{if(view!='reader'||/INPUT|SELECT/.test(e.target.tagName))return;
 if(e.key=='ArrowRight')show(page+1);if(e.key=='ArrowLeft')show(page-1)});

// ---------- slider ----------
const slw=$('slw');
function sl(e){const r=slw.getBoundingClientRect(),N=doc.numPages;
 const f=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));dpg=Math.round(1+f*(N-1));
 $('fill').style.height=f*100+'%';const b=$('bub');b.style.top=f*100+'%';
 const c=chapOf(dpg);b.innerHTML=(c?'<div class="bc">'+esc(c.t)+'</div>':'')+'Page '+dpg;
 $('pgpill').textContent=dpg+' of '+N}
slw.onpointerdown=e=>{if(!doc)return;drag=true;slw.setPointerCapture(e.pointerId);$('mw').classList.add('drag');sl(e)};
slw.onpointermove=e=>{if(drag)sl(e)};
slw.onpointerup=slw.onpointercancel=()=>{if(!drag)return;drag=false;$('mw').classList.remove('drag');show(dpg);pageChanged()};

// ---------- bookmarks / contents ----------
function toggleBm(){if(!meta)return;const b=meta.bm=meta.bm||[],i=b.indexOf(page);
 if(i<0){b.push(page);toast('বুকমার্ক যোগ হয়েছে')}else{b.splice(i,1);toast('বুকমার্ক সরানো হয়েছে')}
 pageChanged()}
function renderToc(){let h='<div class="gp"><input id="gpn" type="number" min="1" placeholder="পৃষ্ঠা নং (1-'+(doc?doc.numPages:1)+')"><button data-go="1">যান</button></div><h3>সূচিপত্র</h3>';
 h+=chap.length?chap.map(c=>`<button class="ti" style="padding-left:${12+c.l*18}px" data-g="${c.p}"><span>${esc(c.t)}</span><i>${c.p}</i></button>`).join(''):'<p class="mut">এই PDF-এ সূচিপত্র নেই</p>';
 const bm=((meta&&meta.bm)||[]).slice().sort((a,b)=>a-b);
 h+='<h3>বুকমার্ক</h3>'+(bm.length?bm.map(p=>`<button class="ti" data-g="${p}"><span>🔖 পৃষ্ঠা ${p}</span><i>${p}</i></button>`).join(''):'<p class="mut">কোনো বুকমার্ক নেই</p>');
 $('tocb').innerHTML=h}
$('tocb').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.go){const v=+$('gpn').value;if(v){tog();show(v)}}
 else if(b.dataset.g){tog();show(+b.dataset.g)}};

// ---------- rotate ----------
async function rotatePage(){if(!doc)return;menu(0);meta.rot=meta.rot||{};const n=page;meta.rot[n]=((meta.rot[n]||0)+90)%360;
 const L=(meta.ink||{})[n];if(L)for(const s of L)s.pts=s.pts.map(([u,v])=>[1-v,u]);
 saveMeta();
 if(S.flip=='scroll'){layout();return}
 const old=cache.get(n);cache.delete(n);const o=getEl(n);await o.ready;place(o);if(old)free(old);toast('পৃষ্ঠা ঘোরানো হয়েছে')}

// ---------- Apple Pencil / drawing ----------
const COL=['#111111','#e11d48','#2563eb','#16a34a','#f59e0b','#9333ea','#ffffff'];
function setTool(on){if(on&&S.flip=='scroll'){toast('Scroll মোডে পেন চলে না। Curl বা Slide বেছে নিন');return}
 tool=on;stroke=null;document.body.classList.toggle('drawing',on);
 if(on){tog();menu(0);document.body.classList.remove('showui');toast('Apple Pencil দিয়ে লিখুন')}}
function renderPen(){$('pshb').innerHTML=`<div class="seg2">${[['pen','pen','Pen'],['hl','hl','Highlight'],['er','eraser','Eraser'],['tx','text','Text']].map(k=>`<button data-k="${k[0]}" class="${S.pk==k[0]?'on':''}">${I(k[1])}<small>${k[2]}</small></button>`).join('')}</div>
 <div class="cols">${COL.map(c=>`<i data-c="${c}" style="background:${c}" class="${S.pc==c?'sel':''}"></i>`).join('')}</div>
 <label>Thickness <input type="range" id="psz" min="1" max="12" value="${S.ps}"></label>
 <label>আঙুল দিয়েও আঁকা <input type="checkbox" id="pfd" ${S.fd?'checked':''}></label>
 <button class="mi g3 dg" data-clr="1"><span style="display:flex;align-items:center">${I('trash')}এই পৃষ্ঠার আঁকা মুছুন</span></button>`}
$('pshb').onclick=e=>{const k=e.target.closest('[data-k]'),c=e.target.closest('[data-c]'),x=e.target.closest('[data-clr]');
 if(k){S.pk=k[0]=k.dataset.k;S.pk=k.dataset.k;save();if(!tool)setTool(true);renderPen()}
 else if(c){S.pc=c.dataset.c;save();renderPen()}
 else if(x&&meta&&confirm('এই পৃষ্ঠার সব আঁকা মুছবেন?')){delete meta.ink[page];if(curO)drawInk(curO);saveMeta()}};
$('pshb').oninput=e=>{if(e.target.id=='psz'){S.ps=+e.target.value;save()}};
$('pshb').onchange=e=>{if(e.target.id=='pfd'){S.fd=e.target.checked;save()}};
function drawInk(o){const c=o.ink,x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);
 const L=(meta.ink||{})[o.n];if(L)for(const s of L)strokeDraw(x,s,c.width,c.height)}
function strokeDraw(x,s,W,H){const p=s.pts;if(!p.length)return;x.save();x.lineCap=x.lineJoin='round';
 x.strokeStyle=s.c;x.globalAlpha=s.h?.35:1;x.lineWidth=s.w*W*(s.h?4:1);
 x.beginPath();x.moveTo(p[0][0]*W,p[0][1]*H);
 if(p.length==1)x.lineTo(p[0][0]*W+.01,p[0][1]*H);
 for(let i=1;i<p.length-1;i++){x.quadraticCurveTo(p[i][0]*W,p[i][1]*H,(p[i][0]+p[i+1][0])/2*W,(p[i][1]+p[i+1][1])/2*H)}
 if(p.length>1)x.lineTo(p[p.length-1][0]*W,p[p.length-1][1]*H);
 x.stroke();x.restore()}
function startStroke(e){const o=curO;if(!o)return;meta.ink=meta.ink||{};
 stroke={id:e.pointerId,o,er:S.pk=='er'};
 if(!stroke.er){stroke.s={c:S.pc,w:S.ps/1000,h:S.pk=='hl',pts:[]};(meta.ink[o.n]=meta.ink[o.n]||[]).push(stroke.s)}
 try{e.target.setPointerCapture(e.pointerId)}catch(er){}
 addPts(e)}
function addPts(e){const o=stroke.o,r=o.ink.getBoundingClientRect();
 const evs=e.getCoalescedEvents?e.getCoalescedEvents():[];
 for(const ev of(evs.length?evs:[e])){const p=[(ev.clientX-r.left)/r.width,(ev.clientY-r.top)/r.height];
  if(stroke.er)eraseAt(o,p);else stroke.s.pts.push(p)}
 if(!dr)dr=requestAnimationFrame(()=>{dr=0;if(stroke)drawInk(stroke.o)})}
function eraseAt(o,p){const L=meta.ink[o.n];if(!L)return;const a=o.h/o.w;
 meta.ink[o.n]=L.filter(s=>!s.pts.some(q=>{const dx=q[0]-p[0],dy=(q[1]-p[1])*a;return dx*dx+dy*dy<.0007}))}
function endStroke(){if(!stroke)return;const o=stroke.o;
 if(stroke.s&&!stroke.s.pts.length){const L=meta.ink[o.n];L.splice(L.indexOf(stroke.s),1)}
 stroke=null;drawInk(o);saveMeta()}
function undoInk(){const L=(meta.ink||{})[page];if(L&&L.length){L.pop();if(curO)drawInk(curO);saveMeta()}}

// ---------- editing / export ----------
const toPdf=(u,v,d,W,H)=>{let a,b;if(d==90){a=v;b=1-u}else if(d==180){a=1-u;b=1-v}else if(d==270){a=1-v;b=u}else{a=u;b=v}return[a*W,(1-b)*H]};
async function edit(fn){try{await lib();const d=await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true});const f=await d.embedFont(PDFLib.StandardFonts.Helvetica);
 await fn(d,f);bytes=await d.save();await db('f','put',bytes,cur);await load();toast('সংরক্ষিত হয়েছে')}
 catch(e){toast('এডিট করা যায়নি (শুধু English অক্ষর চলবে)')}}
function addText(e){const o=curO;if(!o)return;const r=o.ink.getBoundingClientRect(),u=(e.clientX-r.left)/r.width,v=(e.clientY-r.top)/r.height,n=o.n,deg=o.rot;
 const t=prompt('Text লিখুন (English)');if(!t)return;
 edit(async(d,f)=>{const pg=d.getPage(n-1),{width:W,height:H}=pg.getSize(),[x,y]=toPdf(u,v,deg,W,H);
  pg.drawText(t,{x,y,size:14,font:f,color:PDFLib.rgb(0,0,0),rotate:PDFLib.degrees(deg)})})}
async function dl(){if(!bytes)return;menu(0);toast('তৈরি হচ্ছে…');let out=bytes;
 try{await lib();const d=await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true});
  const rots=meta.rot||{},ink=meta.ink||{};
  for(const k of new Set([...Object.keys(rots),...Object.keys(ink)])){const n=+k,pg=d.getPage(n-1);if(!pg)continue;
   const ex=rots[n]||0,deg=(pg.getRotation().angle+ex)%360,{width:W,height:H}=pg.getSize(),Wd=deg%180?H:W;
   for(const s of ink[n]||[]){if(!s.pts.length)continue;
    const pts=s.pts.map(([u,v])=>{const[x,y]=toPdf(u,v,deg,W,H);return[x,H-y]});
    if(pts.length==1)pts.push([pts[0][0]+.1,pts[0][1]]);
    const h=s.c.slice(1),col=PDFLib.rgb(...[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255));
    pg.drawSvgPath('M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L'),{x:0,y:H,borderColor:col,borderWidth:s.w*Wd*(s.h?4:1),borderOpacity:s.h?.35:1,borderLineCap:PDFLib.LineCapStyle.Round})}
   if(ex)pg.setRotation(PDFLib.degrees(deg))}
  out=await d.save()}catch(e){}
 const f=new File([out],'edited_'+cur,{type:'application/pdf'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name=='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}

// ---------- find & replace ----------
async function scan(q){const out=[];for(let i=1;i<=doc.numPages;i++){const tc=await(await doc.getPage(i)).getTextContent();
 tc.items.forEach(it=>{if(it.str.toLowerCase().includes(q.toLowerCase()))out.push({page:i,it})})}return out}
async function findNext(){if(!doc)return;const q=$('fq').value;if(!q)return;
 if(q!==lastQ){$('fmsg').textContent='খোঁজা হচ্ছে…';hits=await scan(q);hi=-1;lastQ=q}
 if(!hits.length){$('fmsg').textContent='পাওয়া যায়নি';return}
 hi=(hi+1)%hits.length;$('fmsg').textContent=`${hi+1} / ${hits.length}`;show(hits[hi].page)}
async function replaceAll(){const q=$('fq').value,r=$('fr').value;if(!doc||!q)return;
 const hs=await scan(q);if(!hs.length){$('fmsg').textContent='পাওয়া যায়নি';return}
 await edit(async(d,f)=>{const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  hs.forEach(({page:pn,it})=>{const pg=d.getPage(pn-1),[a,b,c,h,x,y]=it.transform,sz=Math.abs(h)||10;
   pg.drawRectangle({x,y:y-sz*.25,width:it.width,height:sz*1.2,color:PDFLib.rgb(1,1,1)});
   pg.drawText(it.str.replace(re,r),{x,y,size:sz,font:f})})});
 lastQ='';$('fmsg').textContent=hs.length+'টি replace হয়েছে'}

// ---------- settings ----------
async function wake(){try{if(S.wake&&navigator.wakeLock&&!document.hidden){if(!lock||lock.released)lock=await navigator.wakeLock.request('screen')}
 else if(lock){await lock.release();lock=null}}catch(e){}}
function apply(){save();
 document.body.className=document.body.className.replace(/\bt-\S+/g,'').trim()+' t-'+S.mode;
 document.documentElement.style.setProperty('--ac',S.ac);
 $('dim').style.opacity=(100-S.br)/100;
 $('guide').style.display=S.guide&&view=='reader'?'block':'none';
 $('ac').value=S.ac;$('brs').value=S.br;$('gd').checked=S.guide;$('wk').checked=S.wake;$('goal').value=S.goal;$('rs').checked=S.resume;
 document.querySelectorAll('.tile').forEach(t=>t.classList.toggle('sel',t.dataset.t==S.mode));
 document.querySelectorAll('#fm button').forEach(b=>b.querySelector('i').textContent=b.dataset.f==S.flip?'✓':'');
 $('fln').textContent=(FL.find(f=>f[0]==S.flip)||FL[1])[2];
 wake();stats()}
document.onvisibilitychange=()=>{if(document.hidden)flush();else wake()};
const guide=$('guide');
guide.onpointerdown=e=>{guide.setPointerCapture(e.pointerId);guide.onpointermove=m=>guide.style.top=(m.clientY-22)+'px'};
guide.onpointerup=()=>guide.onpointermove=null;
function tog(id){let any=false;
 document.querySelectorAll('.sheet').forEach(s=>{if(s.id==id)s.classList.toggle('show');else s.classList.remove('show');if(s.classList.contains('show'))any=true});
 $('fm').classList.remove('show');document.body.classList.toggle('sheeted',any);
 if(id){menu(0);if(id=='toc')renderToc();if(id=='psh')renderPen()}
 stats()}

// ---------- reading time ----------
setInterval(()=>{if(doc&&view=='reader'&&!document.hidden){const k=day(new Date());T[k]=(T[k]||0)+1;localStorage.t=JSON.stringify(T);stats()}},1000);
function stats(){const k=day(new Date()),m=Math.floor((T[k]||0)/60);
 $('today2').textContent=`📖 আজ ${m}/${S.goal} মিনিট`+(m>=S.goal?' ✅':'');
 if(!$('set').classList.contains('show'))return;
 let tot=0;const v=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const s=T[day(d)]||0;tot+=s;v.push([d.toLocaleDateString('en',{weekday:'short'}),s])}
 const mx=Math.max(...v.map(x=>x[1]),S.goal*60,1);
 $('bars').innerHTML=v.map(x=>`<div style="height:${x[1]/mx*100}%">${Math.round(x[1]/60)}<br>${x[0]}</div>`).join('');
 $('gtxt').textContent=`এই সপ্তাহে মোট ${Math.round(tot/60)} মিনিট • Goal ${m>=S.goal?'✅ পূর্ণ':'চলছে'}`}

// ---------- icons ----------
$('logo1').innerHTML=ICON;
(function(){const u='data:image/svg+xml,'+encodeURIComponent(ICON);
 const f=document.createElement('link');f.rel='icon';f.href=u;document.head.append(f);
 const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=180;c.getContext('2d').drawImage(im,0,0,180,180);
  const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL();document.head.append(l)};im.src=u})();

// ---------- start ----------
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
(async()=>{apply();
 const ms=await db('m','getAll');const l=ms.filter(m=>m.last>0).sort((a,b)=>b.last-a.last)[0];
 if(S.resume&&l)openPdf(l.name);else goHome();
 ready.then(()=>setTimeout(migrate,1500))})();
</script></body></html>
