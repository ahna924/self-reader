<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bookshelf">
<meta name="theme-color" content="#f6f6f8" id="tc">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<title>Bookshelf</title>
<style>
:root{--ac:#6366f1;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);--spr:cubic-bezier(.2,.9,.3,1.15)}
body.t-original{--bg:#f6f6f8;--fg:#111;--ui:rgba(255,255,255,.92);--sh:rgba(250,250,252,.95);--card:#fff;--mut:#777;--cf:none;--cb:multiply}
body.t-quiet{--bg:#48484c;--fg:#ececf0;--ui:rgba(100,100,106,.92);--sh:rgba(82,82,88,.96);--card:#5d5d62;--mut:#b4b4ba;--cf:invert(1) hue-rotate(180deg) brightness(.82);--cb:screen}
body.t-night{--bg:#0b0b0d;--fg:#e8e8ec;--ui:rgba(42,42,47,.92);--sh:rgba(30,30,34,.96);--card:#232327;--mut:#9a9aa0;--cf:invert(1) hue-rotate(180deg) brightness(.85);--cb:screen}
body.t-paper{--bg:#e9e7e8;--fg:#222;--ui:rgba(248,247,247,.92);--sh:rgba(245,243,244,.96);--card:#f6f5f5;--mut:#777;--cf:none;--cb:multiply}
body.t-bold{--bg:#fff;--fg:#000;--ui:rgba(244,244,244,.92);--sh:rgba(250,250,250,.96);--card:#f2f2f2;--mut:#555;--cf:contrast(1.9) brightness(.95);--cb:multiply}
body.t-calm{--bg:#efe2c9;--fg:#3b2f1e;--ui:rgba(247,240,222,.92);--sh:rgba(246,239,222,.96);--card:#f6ecd8;--mut:#6b5a40;--cf:none;--cb:multiply}
body.t-focus{--bg:#fdfbf3;--fg:#222;--ui:rgba(247,245,235,.92);--sh:rgba(250,248,240,.96);--card:#fff;--mut:#777;--cf:none;--cb:multiply}
body.t-eye{--bg:#d3e4ca;--fg:#1f3320;--ui:rgba(233,243,228,.92);--sh:rgba(235,245,230,.96);--card:#e5f0df;--mut:#4d6a4a;--cf:none;--cb:multiply}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:15px/1.3 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid #8883;border-radius:14px;padding:8px 12px}
button{cursor:pointer;touch-action:manipulation}
svg{display:block;flex:none}
#sbar{position:fixed;top:0;left:0;right:0;height:calc(var(--sat) + 4px);z-index:15;pointer-events:none;background:linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,0));opacity:0}
body.lt #sbar{opacity:1}
/* flat look, ~3% depth */
.g3{color:var(--fg);border:0;background:var(--ui);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
 box-shadow:0 1px 4px rgba(0,0,0,.06),0 0 0 .5px rgba(0,0,0,.04);transition:transform .18s var(--spr),background .2s}
.g3:active{transform:scale(.95)}
/* liquid glass (scrubber) */
.lg{color:var(--fg);border:0;
 background:linear-gradient(135deg,rgba(255,255,255,.4),rgba(255,255,255,.06) 50%,rgba(255,255,255,.24));
 -webkit-backdrop-filter:blur(14px) saturate(1.8);backdrop-filter:blur(14px) saturate(1.8);
 box-shadow:inset 0 0 0 1.2px rgba(255,255,255,.65),inset 0 2px 3px rgba(255,255,255,.65),inset 0 -2px 4px rgba(0,0,0,.08),0 0 0 .5px rgba(0,0,0,.2),0 8px 22px rgba(0,0,0,.22);
 transition:transform .18s var(--spr)}
.lg:active{transform:scale(.94)}
/* Apple Books style white glass (close button, page number, chapter) */
.gl{color:var(--fg);border:0;background:rgba(255,255,255,.5);background:color-mix(in srgb,#fff 48%,transparent);
 -webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);
 box-shadow:0 2px 12px rgba(0,0,0,.13),0 0 0 .5px rgba(0,0,0,.05);transition:transform .18s var(--spr)}
.gl:active{transform:scale(.94)}
body.t-quiet .gl,body.t-night .gl{background:rgba(255,255,255,.16);box-shadow:0 2px 12px rgba(0,0,0,.35),inset 0 0 0 .5px rgba(255,255,255,.2)}
input.sw{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:16px;background:rgba(120,120,128,.34);position:relative;transition:background .25s;padding:0;border:0;flex:none;cursor:pointer}
input.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.25),0 1px 1px rgba(0,0,0,.16);transition:transform .28s var(--spr)}
input.sw:checked{background:#34c759}input.sw:checked::after{transform:translateX(20px)}
input.rg{-webkit-appearance:none;appearance:none;height:8px;border-radius:4px;padding:0;border:0;flex:1;min-width:0;
 background:linear-gradient(90deg,var(--ac) calc(23px + (100% - 46px)*var(--p,.5)),rgba(128,128,128,.3) 0)}
input.rg::-webkit-slider-thumb{-webkit-appearance:none;width:46px;height:28px;border-radius:14px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.22),0 0 0 .5px rgba(0,0,0,.1)}
input.rg::-moz-range-thumb{width:46px;height:28px;border-radius:14px;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.22)}
/* home */
#home{position:fixed;inset:0;overflow:auto;padding:calc(var(--sat) + 18px) 16px 40px;-webkit-overflow-scrolling:touch}
#home.in{animation:fin .4s ease}
.top{display:flex;align-items:center;gap:10px}
.top>span svg{width:44px;height:44px;border-radius:11px;box-shadow:0 6px 14px #6366f177}
.top h1{margin:0;font-size:30px;flex:1;letter-spacing:-.5px}
.round{width:42px;height:42px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center}
.chip{display:inline-block;margin:12px 0 0;padding:5px 12px;border-radius:20px;background:var(--card);font-size:12px;color:var(--mut);box-shadow:0 1px 4px #0002}
h2{font-size:20px;margin:26px 0 12px}
.hero{display:flex;gap:16px;background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 50%),var(--card);border-radius:22px;padding:16px;margin-top:18px;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),0 10px 30px #0003;cursor:pointer;animation:pop .55s var(--spr) backwards;transition:transform .18s var(--spr)}
.hero:active{transform:scale(.98)}
.hero .cv{width:96px;flex:none}
.hi{display:flex;flex-direction:column;gap:6px;justify-content:center;min-width:0;flex:1}
.hi small{color:var(--ac);font-weight:700;letter-spacing:1px;font-size:11px}
.hi b{font-size:17px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hi span{color:var(--mut);font-size:13px}
.hi button{background:var(--ac);color:#fff;border:0;align-self:flex-start;margin-top:4px;border-radius:20px;padding:8px 16px;pointer-events:none;box-shadow:inset 0 1px 0 #fff6,0 4px 10px #0003}
.pb{height:5px;background:#8883;border-radius:5px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:22px 16px}
.book,.hero{-webkit-touch-callout:none}
.book{cursor:pointer;animation:pop .5s var(--spr) backwards;animation-delay:calc(var(--i,0)*35ms)}
.book img,.hero img{pointer-events:none;-webkit-user-drag:none}
.cv{position:relative;aspect-ratio:3/4;border-radius:3px 9px 9px 3px;overflow:hidden;box-shadow:0 10px 20px #0004;background:linear-gradient(135deg,#6366f1,#a855f7);display:flex;align-items:center;justify-content:center;font-size:34px;transition:transform .2s var(--spr)}
.book:active .cv{transform:scale(.94)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0005 0,#fff4 3%,#0001 6%,transparent 12%);pointer-events:none}
.book .t{font-size:12px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book .p{font-size:11px;color:var(--mut)}
.empty{text-align:center;padding:60px 20px;color:var(--mut)}
.empty svg{width:96px;height:96px;border-radius:24px;box-shadow:0 10px 30px #6366f155;margin:0 auto}
.empty button{background:var(--ac);color:#fff;border:0;border-radius:24px;padding:12px 24px;margin-top:18px;font-size:16px}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.94)}}
@keyframes fin{from{opacity:0}}
@keyframes rin{from{opacity:0;transform:scale(.94)}}
@keyframes mpop{from{opacity:0;transform:translateY(16px) scale(.9)}}
/* reader */
#reader{display:none;position:fixed;inset:0;background:var(--bg)}
#reader.in{animation:rin .38s cubic-bezier(.2,.8,.2,1)}
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none;background:var(--bg);-webkit-user-select:text;user-select:text}
body.sm #stage{overflow:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#pbox{position:absolute;inset:0;transform-origin:0 0;background:var(--bg);will-change:transform;-webkit-user-select:text;user-select:text}
#sc{display:none;position:relative}
.pg{position:absolute;background:var(--bg);backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:translateZ(0);-webkit-user-select:text;user-select:text}
.pg canvas{-webkit-user-select:none;user-select:none}
.pc{display:block;width:100%;height:100%;filter:var(--cf);mix-blend-mode:var(--cb)}
.sp .pc{height:auto}
#cc,#cs{position:absolute;left:0;top:0;width:100%;height:100%;display:none;pointer-events:none}
.ink{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
body.drawing .pg .ink{pointer-events:auto;touch-action:none}
.tlay{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;line-height:1;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.tlay span{position:absolute;white-space:pre;color:transparent;transform-origin:0 0;-webkit-user-select:text;user-select:text;cursor:text;font-family:system-ui,sans-serif}
.tlay ::selection{background:rgba(10,132,255,.35)}
body.drawing .tlay{pointer-events:none}
.sp{position:relative;background:var(--bg);overflow:hidden}
#spin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:3;pointer-events:none}
#spin.off{display:none}
#spin i{width:34px;height:34px;border:3px solid rgba(128,128,128,.3);border-top-color:var(--ac);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ui{opacity:0;pointer-events:none;transition:opacity .3s,transform .3s var(--spr);transform:translateY(-8px)}
body.showui .ui{opacity:1;pointer-events:auto;transform:none}
body.drawing .ui{opacity:0;pointer-events:none}
.rb{position:fixed;width:46px;height:46px;border-radius:50%;padding:0;display:flex;align-items:center;justify-content:center;z-index:20}
#xbtn{right:14px;top:calc(var(--sat) + 12px)}
#mbtn{right:14px;bottom:calc(var(--sab) + 16px);transform:translateY(8px)}
body.showui #mbtn{transform:none}
body.menuopen #mbtn{opacity:0;pointer-events:none}
.pill{position:fixed;left:50%;transform:translateX(-50%);padding:7px 18px;border-radius:20px;font-size:15px;z-index:20;white-space:nowrap;pointer-events:none}
#chpill{top:calc(var(--sat) + 14px)}
body.showui #chpill{transform:translateX(-50%)}
#pgpill{bottom:calc(var(--sab) + 18px);opacity:0;transition:opacity .3s}
body.showui #pgpill,body.menuopen #pgpill{opacity:1}
body.scrubbing #pgpill{opacity:0}
#ttl{position:fixed;top:calc(var(--sat) + 8px);left:50%;transform:translateX(-50%);max-width:60%;font-size:13px;color:var(--mut);opacity:.75;z-index:4;pointer-events:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;transition:opacity .25s}
body.showui #ttl,body.drawing #ttl{opacity:0}
/* menu */
#mscrim{position:fixed;left:-100px;right:-100px;top:-200px;bottom:-400px;background:radial-gradient(circle at 88% 78%,rgba(0,0,0,.4),rgba(0,0,0,0) 70%);opacity:0;pointer-events:none;transition:opacity .3s;z-index:19}
body.menuopen #mscrim{opacity:1}
#mw{position:fixed;right:14px;bottom:calc(var(--sab) + 16px);z-index:21;opacity:0;visibility:hidden;transform:scale(.82) translateY(14px);transform-origin:100% 100%;transition:opacity .22s,transform .34s var(--spr),visibility .3s}
body.menuopen #mw{opacity:1;visibility:visible;transform:none}
#mp{width:min(280px,62vw);display:flex;flex-direction:column;gap:8px}
body.menuopen #mp>*{animation:mpop .42s var(--spr) backwards;animation-delay:calc(var(--k,0)*40ms)}
body.scrubbing #mp>*:not(.cbt){opacity:0;pointer-events:none;transition:opacity .15s;animation:none}
.mi{display:flex;justify-content:space-between;align-items:center;width:100%;height:48px;padding:0 20px;border-radius:24px;font-size:16px}
.mi b{display:flex;font-weight:600}
.mr{display:flex;gap:8px}.mr .mi{justify-content:center;padding:0}
.mi.on{background:var(--ac);color:#fff}
.aa{font-weight:700;font-size:20px}.aa small{font-size:13px}
.seg{padding:0;overflow:hidden}
.seg button{flex:1;height:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:none;border:0;border-radius:0;color:inherit;font-size:16px}
.seg button+button{flex:0 0 58px;border-left:1px solid rgba(128,128,128,.3)}
#mp .mi:not(.cbt){background:rgba(255,255,255,.3);background:color-mix(in srgb,var(--bg) 50%,transparent);-webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.45),0 2px 12px rgba(0,0,0,.07)}
#mp .mi.on{background:var(--ac);color:#fff}
#mp .cbt{position:relative;padding:0;overflow:hidden;touch-action:none;background:rgba(255,255,255,.3);background:color-mix(in srgb,var(--bg) 50%,transparent);-webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8)}
.cbt .cl{position:absolute;top:0;bottom:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 20px;font-size:16px}
.cbt .cl b{display:flex}
.cbt .cd{position:absolute;top:0;bottom:0;right:0;width:var(--rw,50%);overflow:hidden;background:#1f160a;color:#fff}
.cbt .cd .cl{left:auto;right:0;width:var(--bw,260px)}
/* page scrubber (shown while dragging the Contents pill) */
#scrub{position:fixed;left:50%;bottom:calc(var(--sab) + 86px);width:min(88vw,560px);height:46px;border-radius:23px;z-index:26;overflow:hidden;pointer-events:none;opacity:0;transform:translateX(-50%) scale(.92);transition:opacity .2s,transform .3s var(--spr)}
body.scrubbing #scrub{opacity:1;transform:translateX(-50%)}
#sfill{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(31,22,10,.82)}
body.t-quiet #sfill,body.t-night #sfill{background:rgba(255,255,255,.42)}
#sthumb{position:absolute;top:6px;bottom:6px;width:8px;border-radius:4px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.45)}
#sbub{position:fixed;left:50%;bottom:calc(var(--sab) + 146px);transform:translateX(-50%) scale(.92);padding:10px 24px;border-radius:20px;text-align:center;font-size:18px;white-space:nowrap;z-index:26;pointer-events:none;opacity:0;transition:opacity .2s,transform .3s var(--spr)}
body.scrubbing #sbub{opacity:1;transform:translateX(-50%)}
#sbub .bc{font-size:14px;color:var(--mut);max-width:240px;overflow:hidden;text-overflow:ellipsis;margin:0 auto}
/* markup */
#ptop{position:fixed;top:calc(var(--sat) + 10px);right:14px;display:none;gap:4px;padding:5px;border-radius:30px;z-index:22}
body.drawing #ptop{display:flex;animation:mpop .35s var(--spr)}
#ptop button{width:48px;height:42px;border-radius:21px;border:0;background:none;padding:0;color:var(--fg);display:flex;align-items:center;justify-content:center}
#ptop button.on{background:#0a84ff;color:#fff}
#ptb{position:fixed;left:10px;right:10px;bottom:calc(var(--sab) + 10px);max-width:780px;margin:0 auto;border-radius:44px;height:116px;z-index:22;display:none;padding-top:14px}
body.drawing #ptb{display:block;animation:mpop .4s var(--spr)}
#phd{position:absolute;top:8px;left:50%;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:rgba(128,128,128,.6)}
#pbody{display:flex;align-items:flex-end;gap:10px;height:100%;padding:0 14px;overflow-x:auto;scrollbar-width:none}
#pbody::-webkit-scrollbar{display:none}
.pcr{width:46px;height:46px;border-radius:50%;padding:0;border:0;display:flex;align-items:center;justify-content:center;background:rgba(128,128,128,.2);align-self:center;flex:none}
.pcr:disabled{opacity:.35}
#ptools{display:flex;gap:6px;align-items:flex-end;height:100%;flex:none;margin:0 6px}
.tl{width:40px;height:100%;background:none;border:0;padding:0;overflow:hidden;display:flex;align-items:flex-end;border-radius:0;flex:none}
.tl svg{width:40px;height:90px;margin-bottom:-34px;transition:transform .3s var(--spr)}
.tl.on svg{transform:translateY(-20px)}
#pcols{display:grid;grid-template-columns:repeat(3,38px);gap:8px;align-self:center;flex:none;margin:0 6px}
#pcols i{width:38px;height:38px;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.2);position:relative;cursor:pointer;transition:transform .2s var(--spr)}
#pcols i.sel{outline:3px solid #34c759;outline-offset:2px;transform:scale(1.05)}
#pcols i.wheel{background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
#pcols i input{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;border:0}
/* sheets */
#scrim{position:fixed;left:-100px;right:-100px;top:-200px;bottom:-400px;background:rgba(0,0,0,.28);z-index:29;opacity:0;pointer-events:none;transition:opacity .3s}
body.sheeted #scrim{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:12px;right:12px;bottom:calc(var(--sab) + 12px);margin:0 auto;max-width:720px;max-height:82%;overflow:auto;background:var(--sh);background:color-mix(in srgb,var(--sh) 70%,transparent);-webkit-backdrop-filter:blur(34px) saturate(1.8);backdrop-filter:blur(34px) saturate(1.8);color:var(--fg);padding:14px 16px 16px;z-index:30;border-radius:32px;box-shadow:0 12px 40px rgba(0,0,0,.28);transform:translateY(115%) scale(.96);opacity:0;visibility:hidden;transition:transform .42s var(--spr),opacity .25s,visibility .4s}
.sheet.show{transform:none;opacity:1;visibility:visible}
.sh2{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:19px;font-weight:700}
.xr{width:40px;height:40px;border-radius:50%;padding:0;border:0;background:rgba(128,128,128,.16);background:color-mix(in srgb,var(--fg) 9%,transparent);display:flex;align-items:center;justify-content:center}
.sheet label,.row{display:flex;justify-content:space-between;align-items:center;margin:14px 0;gap:10px}
.sheet .mi{background:rgba(128,128,128,.1);background:color-mix(in srgb,var(--fg) 7%,transparent);box-shadow:none;margin-top:8px;-webkit-backdrop-filter:none;backdrop-filter:none}
.sheet .mi svg{margin-right:10px}
.sheet .mi.dg{color:#e11d48}
.sheet h3{margin:18px 0 6px;font-size:15px;color:var(--mut)}
.trow{display:flex;gap:10px;align-items:center}
.seg3{flex:1;display:flex;height:48px;border-radius:24px;overflow:hidden}
.seg3 button{flex:1;background:none;border:0;border-radius:0;font-weight:600;font-size:22px;padding:0}
.seg3 button small{font-size:14px}
.seg3 button+button{border-left:1px solid rgba(128,128,128,.3)}
.pill2{width:68px;height:48px;border-radius:24px;padding:0;display:flex;align-items:center;justify-content:center}
.seg3.g3,.pill2.g3,.pill2b{background:rgba(128,128,128,.1);background:color-mix(in srgb,var(--fg) 7%,transparent);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.pill2.g3.on{background:var(--ac);color:#fff}
.pill2b{display:flex;align-items:center;gap:8px;border:0;border-radius:22px;padding:10px 16px;font-size:16px}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.rel{position:relative}
.pop{display:none;position:absolute;right:0;top:calc(100% + 10px);background:var(--sh);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);border-radius:22px;box-shadow:0 10px 36px #0004;z-index:5;padding:6px;min-width:230px}
.pop.up{top:auto;bottom:calc(100% + 10px)}
.pop.show{display:block;animation:mpop .3s var(--spr)}
.pop button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:13px 14px;font-size:17px;border-radius:14px}

 if(q!==lastQ){$('fmsg').textContent='খোঁজা হচ্ছে…';hits=await scan(q);hi=-1;lastQ=q}
 if(!hits.length){$('fmsg').textContent='পাওয়া যায়নি';return}
 hi=(hi+1)%hits.length;$('fmsg').textContent=`${hi+1} / ${hits.length}`;show(hits[hi].page)}
async function replaceAll(){const q=$('fq').value,r=$('fr').value;if(!doc||!q)return;
 const hs=await scan(q);if(!hs.length){$('fmsg').textContent='পাওয়া যায়নি';return}
 await edit(async(d,f)=>{const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  hs.forEach(({page:pn,it})=>{const pg=d.getPage(pn-1),[a,b,c,h,x,y]=it.transform,sz=Math.abs(h)||10;
   pg.drawRectangle({x,y:y-sz*.25,width:it.width,height:sz*1.2,color:PDFLib.rgb(1,1,1)});
   pg.drawText(it.str.replace(re,r),{x,y,size:sz,font:f})})});
 lastQ='';$('fmsg').textContent=hs.length+'টি replace হয়েছে'}

 document.querySelectorAll('.tile').forEach(t=>t.classList.toggle('sel',t.dataset.t==S.mode));

 document.querySelectorAll('#am button').forEach(x=>x.querySelector('i').textContent=x.dataset.c==S.ac?'✓':'');
 wake();stats()}

function stats(){const k=day(new Date()),m=Math.floor((T[k]||0)/60);
 $('today2').textContent=`📖 আজ ${m}/${S.goal} মিনিট`+(m>=S.goal?' ✅':'');
 if(!$('set').classList.contains('show'))return;
 let tot=0;const v=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const s=T[day(d)]||0;tot+=s;v.push([d.toLocaleDateString('en',{weekday:'short'}),s])}
 const mx=Math.max(...v.map(x=>x[1]),S.goal*60,1);
 $('bars').innerHTML=v.map(x=>`<div style="height:${x[1]/mx*100}%">${Math.round(x[1]/60)}<br>${x[0]}</div>`).join('');
 $('gtxt').textContent=`এই সপ্তাহে মোট ${Math.round(tot/60)} মিনিট • Goal ${m>=S.goal?'✅ পূর্ণ':'চলছে'}`}

// ---------- self-update check (clears stale cache when a newer index.html exists) ----------
(async()=>{try{if(!navigator.onLine||!('serviceWorker' in navigator))return;
 const r=await fetch('index.html?_='+Date.now(),{cache:'no-store'}),t=await r.text(),m=t.match(/const VER='([^']+)'/);
 if(m&&m[1]!==VER&&!sessionStorage.vr){sessionStorage.vr=1;
  const rg=await navigator.serviceWorker.getRegistrations();await Promise.all(rg.map(x=>x.unregister()));
  for(const k of await caches.keys())await caches.delete(k);
  location.reload()}}catch(e){}})();
